<header
    class="h-20 bg-white/80 backdrop-blur-md border-b border-gray-200 flex items-center justify-between px-8 z-10">
    <div class="flex items-center gap-4">
        <!-- Logo Kampus & Desa (Dashboard Header) -->
        <div class="flex items-center gap-3 bg-gray-50/50 px-3 py-1.5 rounded-xl border border-gray-100">
            <img src="https://lh3.googleusercontent.com/d/1MEEWZk4Ntwr6YfwQBupxNwEm-lDGULgC" alt="Logo UNESA" class="h-7 w-auto object-contain">
            <div class="h-5 w-[1px] bg-gray-200"></div>
            <img src="https://lh3.googleusercontent.com/d/1ZbHhbkh5MYO70C0tiGe9ZFm08Ed5-0ri" alt="Logo Vokasi UNESA" class="h-7 w-auto object-contain">
            <div class="h-5 w-[1px] bg-gray-200"></div>
            <img src="https://lh3.googleusercontent.com/d/1mixxg33C1XQ9PvIvnbTcpIwMjN80g3q9" alt="Logo Desa" class="h-7 w-auto object-contain">
        </div>
        <div class="h-6 w-[1px] bg-gray-200 mx-2 hidden md:block"></div>
        <h1 class="text-2xl font-bold text-gray-800 capitalize" x-text="view.replace('_', ' ')"></h1>
    </div>
    <div class="flex items-center gap-4 relative" x-data="{ open: false }" @click.away="open = false">
        <button @click="open = !open; if(open) readAllNotifications();"
            class="w-10 h-10 rounded-full bg-gray-100 flex items-center justify-center text-gray-500 hover:bg-gray-200 transition-colors relative">
            <i class="fas fa-bell"></i>
            <span x-cloak x-show="unreadNotificationsCount > 0" x-text="unreadNotificationsCount" 
                  class="absolute -top-1 -right-1 w-5 h-5 bg-red-500 rounded-full border border-white text-white text-[10px] font-bold flex items-center justify-center"></span>
        </button>
        
        <!-- Notification Dropdown -->
        <div x-cloak x-show="open" x-transition:enter="transition ease-out duration-200"
             x-transition:enter-start="opacity-0 scale-95 translate-y-2"
             x-transition:enter-end="opacity-100 scale-100 translate-y-0"
             class="absolute right-0 top-12 w-80 bg-white border border-gray-100 rounded-2xl shadow-xl z-50 overflow-hidden max-h-96 flex flex-col">
            <div class="p-4 border-b border-gray-100 bg-gray-50/50 flex justify-between items-center">
                <span class="font-bold text-sm text-gray-800">Notifikasi</span>
                <span x-cloak x-show="unreadNotificationsCount > 0" x-text="unreadNotificationsCount + ' Baru'"
                      class="px-2 py-0.5 bg-red-50 text-red-600 text-[10px] font-bold rounded-lg border border-red-200"></span>
            </div>
            <div class="flex-1 overflow-y-auto divide-y divide-gray-50 max-h-80 no-scrollbar">
                <template x-for="n in notifications" :key="n.id">
                    <div class="p-3.5 hover:bg-gray-50 transition-colors flex gap-3"
                         :class="n.status === 'Belum Dibaca' ? 'bg-emerald-50/30' : ''">
                        <div class="w-8 h-8 rounded-lg bg-emerald-50 text-emerald-600 flex items-center justify-center text-xs shrink-0">
                            <i class="fas fa-envelope-open-text"></i>
                        </div>
                        <div class="flex-1 min-w-0">
                            <p class="text-xs text-gray-700 leading-normal" x-text="n.pesan"></p>
                            <span class="text-[10px] text-gray-400 mt-1 block" x-text="n.timestamp"></span>
                        </div>
                    </div>
                </template>
                <template x-if="notifications.length === 0">
                    <div class="p-8 text-center text-gray-400">
                        <i class="fas fa-bell-slash text-3xl mb-2 opacity-20"></i>
                        <p class="text-xs">Tidak ada notifikasi.</p>
                    </div>
                </template>
            </div>
        </div>
    </div>
</header>
