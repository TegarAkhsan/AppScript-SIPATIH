<script>
    document.addEventListener('alpine:init', () => {
        Alpine.data('sipatihApp', () => ({
            view: 'login',
            user: null,

            username: '',
            password: '',
            loginError: '',
            isLoading: false,

             dashboardData: null,
            arsipData: [],
            usersData: [],
            aktivitasData: [],
            notifications: [],
            klasifikasiOptions: [],
            jenisArsipOptions: [],
            searchQuery: '',

            activeBidangFilter: '',
            selectedBidang: '',
            bidangSearchQuery: '',
            bidangJenisFilter: '',
            bidangSifatFilter: '',
            bidangStatusFilter: '',

            toast: { show: false, message: '', type: 'info' },
            errorModal: { show: false, message: '' },
            preview: { show: false, url: '', title: '' },
            formModal: { show: false, type: '', title: '', isEdit: false, oldNama: '' },

            formData: { 
                fileName: '', 
                fileData: '', 
                sifatSurat: 'Biasa', 
                keterangan: '',
                jenisSurat: '',
                noSurat: '',
                tglSurat: '',
                keperluan: '',
                tandaTangan: '',
                buatKeluarOtomatis: false
            },
            filterDownload: { startDate: '', endDate: '' },
            profileData: { newPassword: '', confirmPassword: '' },

            get unreadNotificationsCount() {
                return this.notifications.filter(n => n.status === 'Belum Dibaca').length;
            },

            get filteredArsipData() {
                let data = this.arsipData;
                if (this.user && this.user.role !== 'Admin' && this.user.role !== 'Kepala Desa') {
                    const uBidang = this.user.bidang;
                    if (uBidang && uBidang !== 'Semua') {
                        data = data.filter(a => a.bidang === uBidang);
                    }
                }
                if (this.activeBidangFilter) {
                    data = data.filter(a => a.bidang === this.activeBidangFilter);
                }
                if (this.searchQuery) {
                    const q = this.searchQuery.toLowerCase();
                    data = data.filter(a => 
                        (a.noSurat && a.noSurat.toLowerCase().includes(q)) ||
                        (a.perihal && a.perihal.toLowerCase().includes(q)) ||
                        (a.asalInstansi && a.asalInstansi.toLowerCase().includes(q)) ||
                        (a.tujuanInstansi && a.tujuanInstansi.toLowerCase().includes(q)) ||
                        (a.keterangan && a.keterangan.toLowerCase().includes(q))
                    );
                }
                return data;
            },

            get filteredBidangArsipData() {
                let data = this.arsipData;
                
                // Filter by selected Bidang
                if (this.selectedBidang) {
                    data = data.filter(a => a.bidang.toLowerCase() === this.selectedBidang.toLowerCase());
                }
                
                // Filter by Jenis (Masuk / Keluar)
                if (this.bidangJenisFilter) {
                    data = data.filter(a => a.jenis === this.bidangJenisFilter);
                }
                
                // Filter by Sifat Surat
                if (this.bidangSifatFilter) {
                    data = data.filter(a => a.sifatSurat === this.bidangSifatFilter);
                }
                
                // Filter by Status Arsip
                if (this.bidangStatusFilter) {
                    data = data.filter(a => a.statusArsip === this.bidangStatusFilter);
                }
                
                // Filter by Search Query
                if (this.bidangSearchQuery) {
                    const q = this.bidangSearchQuery.toLowerCase();
                    data = data.filter(a => 
                        (a.noSurat && a.noSurat.toLowerCase().includes(q)) ||
                        (a.perihal && a.perihal.toLowerCase().includes(q)) ||
                        (a.instansi && a.instansi.toLowerCase().includes(q)) ||
                        (a.noAgenda && a.noAgenda.toLowerCase().includes(q)) ||
                        (a.jenisSurat && a.jenisSurat.toLowerCase().includes(q)) ||
                        (a.keterangan && a.keterangan.toLowerCase().includes(q))
                    );
                }
                
                return data;
            },

            init() {
                this.checkSession();
                this.loadKlasifikasiOptions();
                this.loadNotifications();
                
                // Jalankan pengecekan sesi dan notifikasi realtime setiap 15 detik
                setInterval(() => {
                    this.checkSession();
                    this.loadNotifications();
                }, 15000);
                
                // Pantau aktivitas user untuk memperbarui timestamp
                ['mousedown', 'mousemove', 'keypress', 'scroll', 'touchstart'].forEach(name => {
                    document.addEventListener(name, () => this.updateActivity());
                });
            },

            updateActivity() {
                if (this.user) {
                    localStorage.setItem('sipatih_last_activity', Date.now().toString());
                }
            },

            checkSession() {
                const savedUser = localStorage.getItem('sipatih_user');
                const lastActivity = localStorage.getItem('sipatih_last_activity');
                const now = Date.now();
                const timeout = 30 * 60 * 1000; // 30 menit

                if (savedUser && lastActivity) {
                    if (now - parseInt(lastActivity) > timeout) {
                        this.user = null;
                        localStorage.removeItem('sipatih_user');
                        localStorage.removeItem('sipatih_last_activity');
                        this.navigate('login');
                        this.showError('Sesi Anda telah berakhir (30 menit tidak ada aktivitas). Silakan login kembali.');
                    } else {
                        this.user = JSON.parse(savedUser);
                        if (this.view === 'login') {
                            this.loadDashboard();
                            this.navigate('dashboard');
                        }
                    }
                } else if (this.view !== 'login' && !savedUser) {
                    this.navigate('login');
                }
            },

            showToast(message, type = 'info') {
                this.toast.message = message;
                this.toast.type = type;
                this.toast.show = true;
                // Reset show after animation
                setTimeout(() => {
                    this.toast.show = false;
                }, 4000);
            },

            showError(message) {
                this.errorModal.message = message;
                this.errorModal.show = true;
            },

            openPreview(arsip) {
                this.preview.url = arsip.linkFile;
                this.preview.title = arsip.perihal;
                this.preview.item = arsip;
                this.preview.show = true;
            },

            openForm(type, item = null) {
                this.formModal.type = type;
                this.formModal.isEdit = !!item;
                
                if (item) {
                    this.formData = { ...item };
                    if (type === 'bidang') {
                        this.formModal.oldNama = item.nama;
                        this.formModal.title = 'Edit Kategori Bidang';
                    }
                    if (type === 'pengguna') {
                        this.formModal.oldNama = item.username;
                        this.formModal.title = 'Edit Pengguna';
                    }
                    if (type === 'naskah_masuk' || type === 'naskah_keluar') {
                        this.formModal.title = type === 'naskah_masuk' ? 'Edit Naskah Masuk' : 'Edit Naskah Keluar';
                        this.formModal.oldNoSurat = item.noSurat;
                        if (this.user && this.user.bidang && this.user.bidang !== 'Semua') {
                            this.jenisArsipOptions = this.klasifikasiOptions.filter(o => o.bidang.toLowerCase() === this.user.bidang.toLowerCase());
                        } else {
                            this.jenisArsipOptions = this.klasifikasiOptions;
                        }
                    }
                } else {
                    this.formData = { 
                        fileName: '', 
                        fileData: '', 
                        noAgenda: '',
                        kodeKlasifikasi: '',
                        sifatSurat: 'Biasa', 
                        keterangan: '',
                        jenisSurat: '',
                        noSurat: '',
                        tglSurat: new Date().toISOString().substring(0, 10),
                        tglTerima: type === 'naskah_masuk' ? new Date().toISOString().substring(0, 10) : '',
                        instansi: '',
                        perihal: '',
                        keperluan: '',
                        tandaTangan: '',
                        bidang: (this.user && this.user.bidang !== 'Semua') ? this.user.bidang : '',
                        buatKeluarOtomatis: false
                    };
                    
                    if (type === 'naskah_masuk' || type === 'naskah_keluar') {
                        if (this.user && this.user.bidang && this.user.bidang !== 'Semua') {
                            this.jenisArsipOptions = this.klasifikasiOptions.filter(o => o.bidang.toLowerCase() === this.user.bidang.toLowerCase());
                        } else {
                            this.jenisArsipOptions = this.klasifikasiOptions;
                        }
                    }
                    
                    if (type === 'naskah_masuk') {
                        this.formModal.title = 'Input Naskah Masuk';
                        this.fetchNextNoAgenda('Masuk');
                    }
                    if (type === 'naskah_keluar') {
                        this.formModal.title = 'Input Naskah Keluar';
                        this.fetchNextNoAgenda('Keluar');
                    }
                    if (type === 'pengguna') {
                        this.formModal.title = 'Tambah Pengguna';
                        this.formData.role = 'Perangkat Desa';
                        this.formData.bidang = 'Semua';
                    }
                    if (type === 'bidang') this.formModal.title = 'Tambah Kategori Bidang';
                }
                this.formModal.show = true;
            },

            async confirmDeleteBidang(bidang) {
                if (confirm(`Apakah Anda yakin ingin menghapus bidang "${bidang.nama}"? Data arsip dengan bidang ini tetap tersimpan tetapi kategorinya akan hilang.`)) {
                    this.isLoading = true;
                    if (typeof google !== 'undefined' && google.script && google.script.run) {
                        google.script.run
                            .withSuccessHandler((res) => {
                                this.isLoading = false;
                                if (res.success) {
                                    this.showToast('Kategori bidang berhasil dihapus', 'success');
                                    this.loadDashboard();
                                } else {
                                    this.showError(res.message);
                                }
                            })
                            .withFailureHandler((err) => {
                                this.isLoading = false;
                                this.showError(err.message || 'Gagal menghapus bidang');
                            })
                            .deleteBidang(bidang.nama, this.user.username);
                    } else {
                        setTimeout(() => {
                            this.isLoading = false;
                            this.showToast('Simulasi: Bidang dihapus', 'success');
                            this.loadDashboard();
                        }, 1000);
                    }
                }
            },

            handleFileChange(e) {
                const file = e.target.files[0];
                if (!file) return;
                if (file.size > 10 * 1024 * 1024) return this.showError('Ukuran file terlalu besar (Maks 10MB)');

                const reader = new FileReader();
                reader.onload = (f) => {
                    this.formData.fileData = f.target.result;
                    this.formData.fileName = file.name;
                };
                reader.readAsDataURL(file);
            },

            async submitForm() {
                this.isLoading = true;
                const type = this.formModal.type;

                try {
                    if (typeof google !== 'undefined' && google.script && google.script.run) {
                        if (type === 'naskah_masuk' || type === 'naskah_keluar') {
                            const subType = type === 'naskah_masuk' ? 'Masuk' : 'Keluar';

                            if (this.formData.fileData) {
                                this.showToast('Memproses dan mengunggah file...', 'info');
                            }

                            if (this.formModal.isEdit) {
                                google.script.run
                                    .withSuccessHandler((res) => {
                                        this.handleResponse(res, 'Data naskah berhasil diperbarui');
                                    })
                                    .withFailureHandler((err) => {
                                        this.isLoading = false;
                                        this.showError(err.message || 'Gagal memperbarui naskah');
                                    })
                                    .updateArsipWithFile(
                                        subType,
                                        this.formModal.oldNoSurat,
                                        this.formData,
                                        this.user.username,
                                        this.formData.fileData || null,
                                        this.formData.fileName || null
                                    );
                            } else {
                                google.script.run
                                    .withSuccessHandler((res) => {
                                        this.handleResponse(res, 'Data naskah berhasil disimpan');
                                    })
                                    .withFailureHandler((err) => {
                                        this.isLoading = false;
                                        this.formModal.show = false;
                                        this.showToast('Data tersimpan. Catatan: ' + (err.message || 'Periksa kembali data Anda.'), 'info');
                                        setTimeout(() => this.navigate(this.view), 500);
                                    })
                                    .saveArsipWithFile(
                                        subType,
                                        this.formData,
                                        this.user.username,
                                        this.formData.fileData || null,
                                        this.formData.fileName || null
                                    );
                            }

                        } else if (type === 'pengguna') {
                            if (this.formModal.isEdit) {
                                google.script.run
                                    .withSuccessHandler((res) => { this.handleResponse(res, 'User berhasil diperbarui'); })
                                    .withFailureHandler((err) => { this.isLoading = false; this.showError(err.message || 'Gagal memperbarui user'); })
                                    .updateUser(this.formModal.oldNama, this.formData, this.user.username);
                            } else {
                                google.script.run
                                    .withSuccessHandler((res) => { this.handleResponse(res, 'User baru berhasil ditambahkan'); })
                                    .withFailureHandler((err) => { this.isLoading = false; this.showError(err.message || 'Gagal menambahkan user'); })
                                    .saveUser(this.formData, this.user.username);
                            }
                        } else if (type === 'bidang') {
                            if (this.formModal.isEdit) {
                                google.script.run
                                    .withSuccessHandler((res) => { this.handleResponse(res, 'Kategori bidang berhasil diperbarui'); })
                                    .withFailureHandler((err) => { this.isLoading = false; this.showError(err.message || 'Gagal memperbarui bidang'); })
                                    .updateBidang(this.formModal.oldNama, this.formData, this.user.username);
                            } else {
                                google.script.run
                                    .withSuccessHandler((res) => { this.handleResponse(res, 'Kategori bidang berhasil ditambahkan'); })
                                    .withFailureHandler((err) => { this.isLoading = false; this.showError(err.message || 'Gagal menambahkan bidang'); })
                                    .saveBidang(this.formData, this.user.username);
                            }
                        }
                    } else {
                        // Mock (Local Development)
                        setTimeout(() => {
                            this.isLoading = false;
                            this.formModal.show = false;
                            this.showToast('Simulasi: Data berhasil disimpan', 'success');
                            this.navigate(this.view);
                        }, 1000);
                    }
                } catch (e) {
                    this.isLoading = false;
                    this.showError(e.message);
                }
            },

            handleResponse(res, successMsg) {
                this.isLoading = false;
                if (res && res.success) {
                    this.formModal.show = false;
                    // If there's a warning (e.g. file upload failed but data saved), show warning toast
                    if (res.warning) {
                        this.showToast('Data tersimpan. Catatan: ' + res.warning, 'info');
                    } else {
                        this.showToast(successMsg, 'success');
                    }
                    setTimeout(() => this.navigate(this.view), 300);
                } else {
                    this.showError((res && res.message) ? res.message : 'Terjadi kesalahan sistem');
                }
            },

            async saveProfileUpdate() {
                if (!this.profileData.newPassword) return this.showToast('Password tidak boleh kosong', 'error');
                if (this.profileData.newPassword !== this.profileData.confirmPassword) return this.showToast('Konfirmasi password tidak cocok', 'error');

                this.isLoading = true;
                if (typeof google !== 'undefined' && google.script && google.script.run) {
                    google.script.run.withSuccessHandler((res) => {
                        this.isLoading = false;
                        if (res.success) {
                            this.showToast('Profil berhasil diperbarui', 'success');
                            this.profileData = { newPassword: '', confirmPassword: '' };
                        } else {
                            this.showToast(res.message, 'error');
                        }
                    }).updateProfile(this.profileData.newPassword, this.user.username);
                } else {
                    setTimeout(() => {
                        this.isLoading = false;
                        this.showToast('Simulasi: Profil berhasil diperbarui', 'success');
                        this.profileData = { newPassword: '', confirmPassword: '' };
                    }, 1000);
                }
            },

            doLogin() {
                this.isLoading = true;
                this.loginError = '';

                if (typeof google !== 'undefined' && google.script && google.script.run) {
                    google.script.run.withSuccessHandler((res) => {
                        this.isLoading = false;
                        if (res.success) {
                            this.user = res;
                            localStorage.setItem('sipatih_user', JSON.stringify(res));
                            localStorage.setItem('sipatih_last_activity', Date.now().toString());
                            this.loadDashboard();
                            this.navigate('dashboard');
                            this.showToast('Selamat Datang, ' + res.username, 'success');
                        } else {
                            this.loginError = res.message;
                        }
                    }).login(this.username, this.password);
                } else {
                    // Mock for local preview
                    setTimeout(() => {
                        this.isLoading = false;
                        if ((this.username === 'admin' && this.password === 'admin') ||
                            (this.username === 'user' && this.password === 'user')) {
                            this.user = { success: true, role: this.username === 'admin' ? 'Admin' : 'Perangkat Desa', username: this.username };
                            localStorage.setItem('sipatih_user', JSON.stringify(this.user));
                            localStorage.setItem('sipatih_last_activity', Date.now().toString());
                            this.navigate('dashboard');
                            this.showToast('Login Berhasil (Mode Demo)', 'success');
                        } else {
                            this.loginError = 'Username atau password salah! (Gunakan admin/admin)';
                        }
                    }, 800);
                }
            },

            autoLogin(role) {
                this.username = role;
                this.password = role;
                this.doLogin();
            },

            doLogout() {
                this.user = null;
                this.username = '';
                this.password = '';
                localStorage.removeItem('sipatih_user');
                localStorage.removeItem('sipatih_last_activity');
                this.navigate('login');
                this.showToast('Sesi Anda telah berakhir', 'info');
            },

            navigate(page) {
                this.view = page;
                
                // Hanya hapus filter jika navigasi keluar dari halaman arsip (naskah masuk/keluar)
                if (page !== 'naskah_masuk' && page !== 'naskah_keluar') {
                    this.activeBidangFilter = '';
                }

                // Always ensure dashboard data is available for bidang lists
                if (!this.dashboardData) this.loadDashboard();

                if (page === 'dashboard') this.loadDashboard();
                if (page === 'naskah_masuk' || page === 'naskah_keluar' || page === 'detail_bidang') this.loadArsip();
                if (page === 'pengguna') this.loadPengguna();
                if (page === 'tracking') this.loadTracking();
                if (page === 'bidang_dokumen') this.loadDashboard();
            },

            viewArsipBidang(bidangName) {
                this.selectedBidang = bidangName;
                this.bidangSearchQuery = '';
                this.bidangJenisFilter = '';
                this.bidangSifatFilter = '';
                this.bidangStatusFilter = '';
                this.navigate('detail_bidang');
            },

            loadDashboard() {
                if (typeof google !== 'undefined' && google.script && google.script.run) {
                    google.script.run.withSuccessHandler(data => this.dashboardData = data).getDashboardData(this.user?.username);
                } else {
                    this.dashboardData = {
                        totalArsip: 550, totalBidang: 4, arsipAktif: 400, arsipInaktif: 150, bidangList: [
                            { kode: 'PEM', nama: 'Pemerintahan', jumlah: 120 },
                            { kode: 'KES', nama: 'Kesejahteraan', jumlah: 85 },
                            { kode: 'KEP', nama: 'Kependudukan', jumlah: 300 },
                            { kode: 'UMU', nama: 'Umum', jumlah: 45 }
                        ]
                    };
                }
            },

            loadArsip() {
                if (typeof google !== 'undefined' && google.script && google.script.run) {
                    google.script.run.withSuccessHandler(data => this.arsipData = data).getArsipData(this.user?.username);
                } else {
                    this.arsipData = [
                        { jenis: 'Masuk', noIndeks: '001', noSurat: '470/01/DS/2023', perihal: 'Permohonan Akte Lahir', bidang: 'Kependudukan', tglSurat: '01-10-2023', sifatSurat: 'Biasa', asalInstansi: 'Warga', statusArsip: 'Aktif' },
                        { jenis: 'Keluar', noIndeks: '002', noSurat: '590/12/DS/2023', perihal: 'Sertifikat Tanah Desa', bidang: 'Umum', tglSurat: '05-10-2023', sifatSurat: 'Penting', tujuanInstansi: 'BPN', statusArsip: 'Aktif' }
                    ];
                }
            },

            loadPengguna() {
                if (typeof google !== 'undefined' && google.script && google.script.run) {
                    google.script.run.withSuccessHandler(data => this.usersData = data).getUsers();
                } else {
                    this.usersData = [
                        { id: 1, username: 'admin', password: 'admin', role: 'Admin', status: 'Aktif', bidang: 'Semua' },
                        { id: 2, username: 'user', password: 'user', role: 'Perangkat Desa', status: 'Aktif', bidang: 'Pemerintahan' }
                    ];
                }
            },

            loadTracking() {
                if (typeof google !== 'undefined' && google.script && google.script.run) {
                    google.script.run.withSuccessHandler(data => this.aktivitasData = data).getAktivitas();
                } else {
                    this.aktivitasData = [
                        { username: 'admin', timestamp: '2023-10-27 10:00:00', aktivitas: 'Login', detail: 'Berhasil login ke sistem' }
                    ];
                }
            },

            downloadExcel() {
                this.showToast('Menyiapkan file Excel...', 'info');
                if (typeof google !== 'undefined' && google.script && google.script.run) {
                    google.script.run.withSuccessHandler(url => {
                        window.open(url, '_blank');
                        this.showToast('Download dimulai', 'success');
                    }).downloadDataArsip(this.user?.username || 'admin', this.filterDownload.startDate, this.filterDownload.endDate);
                } else {
                    setTimeout(() => this.showToast('Simulasi: Excel berhasil didownload', 'success'), 1000);
                }
            },

            downloadZip() {
                this.showToast('Menyiapkan paket ZIP...', 'info');
                if (typeof google !== 'undefined' && google.script && google.script.run) {
                    google.script.run.withSuccessHandler(url => {
                        window.open(url, '_blank');
                        this.showToast('Download ZIP dimulai', 'success');
                    }).downloadDataZip(this.user?.username || 'admin', this.filterDownload.startDate, this.filterDownload.endDate);
                } else {
                    setTimeout(() => this.showToast('Simulasi: ZIP berhasil didownload', 'success'), 1500);
                }
            },

            // ----------------------------------------------------
            // Helper Admin Pengguna & Hapus
            // ----------------------------------------------------
            async confirmDeleteUser(u) {
                if (u.username === this.user.username) {
                    return this.showToast('Tidak dapat menghapus akun Anda sendiri yang sedang aktif!', 'error');
                }
                if (confirm(`Apakah Anda yakin ingin menghapus pengguna "${u.username}"?`)) {
                    this.isLoading = true;
                    if (typeof google !== 'undefined' && google.script && google.script.run) {
                        google.script.run
                            .withSuccessHandler((res) => {
                                this.isLoading = false;
                                if (res.success) {
                                    this.showToast('Pengguna berhasil dihapus', 'success');
                                    this.loadPengguna();
                                } else {
                                    this.showError(res.message);
                                }
                            })
                            .withFailureHandler((err) => {
                                this.isLoading = false;
                                this.showError(err.message || 'Gagal menghapus pengguna');
                            })
                            .deleteUser(u.username, this.user.username);
                    } else {
                        setTimeout(() => {
                            this.isLoading = false;
                            this.showToast('Simulasi: Pengguna dihapus', 'success');
                            this.loadPengguna();
                        }, 1000);
                    }
                }
            },

            // ----------------------------------------------------
            // Helper Notifikasi
            // ----------------------------------------------------
            loadNotifications() {
                if (this.user && typeof google !== 'undefined' && google.script && google.script.run) {
                    google.script.run
                        .withSuccessHandler(data => {
                            const oldUnreadCount = this.unreadNotificationsCount;
                            this.notifications = data;
                            const newUnreadCount = this.unreadNotificationsCount;
                            if (newUnreadCount > oldUnreadCount && oldUnreadCount > 0) {
                                this.showToast('Ada notifikasi baru masuk!', 'info');
                            }
                        })
                        .getNotifications(this.user.username);
                }
            },

            readAllNotifications() {
                if (this.unreadNotificationsCount === 0) return;
                this.notifications.forEach(n => n.status = 'Dibaca'); // optimistic update
                if (this.user && typeof google !== 'undefined' && google.script && google.script.run) {
                    google.script.run
                        .withSuccessHandler(() => this.loadNotifications())
                        .markNotificationsAsRead(this.user.username);
                }
            },

            // ----------------------------------------------------
            // Helper Retensi Surat
            // ----------------------------------------------------
            async changeStatus(arsip, newStatus) {
                if (arsip.statusArsip === newStatus) return;
                const originalStatus = arsip.statusArsip;
                arsip.statusArsip = newStatus; // optimistic update
                
                if (typeof google !== 'undefined' && google.script && google.script.run) {
                    google.script.run
                        .withSuccessHandler((res) => {
                            if (res.success) {
                                this.showToast(`Status naskah berhasil diubah menjadi ${newStatus}`, 'success');
                                this.loadDashboard(); // update counts
                            } else {
                                arsip.statusArsip = originalStatus; // rollback
                                this.showError(res.message);
                            }
                        })
                        .withFailureHandler((err) => {
                            arsip.statusArsip = originalStatus; // rollback
                            this.showError(err.message || 'Gagal mengubah status naskah');
                        })
                        .setArsipStatus(arsip.jenis, arsip.noSurat, newStatus, this.user.username);
                } else {
                    setTimeout(() => {
                        this.showToast(`Simulasi: Status naskah diubah menjadi ${newStatus}`, 'success');
                        this.loadDashboard();
                    }, 500);
                }
            },

            // ----------------------------------------------------
            // Helper Agenda & Klasifikasi Otomatis
            // ----------------------------------------------------
            fetchNextNoAgenda(type) {
                if (typeof google !== 'undefined' && google.script && google.script.run) {
                    google.script.run
                        .withSuccessHandler(code => {
                            this.formData.noAgenda = code;
                        })
                        .getNextNoAgenda(type);
                } else {
                    const seq = (this.arsipData.filter(a => a.jenis === type).length + 1).toString().padStart(3, '0');
                    const code = type === 'Masuk' ? 'SM' : 'SK';
                    this.formData.noAgenda = `${seq}/${code}/05/2026`;
                }
            },

            loadKlasifikasiOptions() {
                if (typeof google !== 'undefined' && google.script && google.script.run) {
                    google.script.run
                        .withSuccessHandler(data => {
                            this.klasifikasiOptions = data;
                        })
                        .getKlasifikasiOptions();
                } else {
                    this.klasifikasiOptions = [
                        { bidang: 'Pemerintahan', kode: 'PEM.01', jenisArsip: 'Surat Umum' },
                        { bidang: 'Pemerintahan', kode: 'PEM.02', jenisArsip: 'Sosialisasi dan Undangan' },
                        { bidang: 'Kesejahteraan', kode: 'KES.01', jenisArsip: 'Perkawinan' },
                        { bidang: 'Kesejahteraan', kode: 'KES.02', jenisArsip: 'Kesejahteraan Sosial' },
                        { bidang: 'Kependudukan', kode: 'KEP.01', jenisArsip: 'Pindah Keluar / Masuk' },
                        { bidang: 'Kependudukan', kode: 'KEP.02', jenisArsip: 'Kematian / Akte Kematian' },
                        { bidang: 'Kependudukan', kode: 'KEP.03', jenisArsip: 'Kelahiran / Akte Lahir' },
                        { bidang: 'Kependudukan', kode: 'KEP.04', jenisArsip: 'Pembuatan / Perubahan KK' },
                        { bidang: 'Pertanahan', kode: 'PER.01', jenisArsip: 'Mutasi Tanah (Jual beli / waris/ hibah)' },
                        { bidang: 'Pertanahan', kode: 'PER.02', jenisArsip: 'Mutasi PBB' },
                        { bidang: 'Pertanahan', kode: 'PER.03', jenisArsip: 'Keterangan Tanah Lainnya' },
                        { bidang: 'Umum', kode: 'UMU.01', jenisArsip: 'Surat Lainnya' }
                    ];
                }
            },

            onBidangChange() {
                if (this.formData.bidang) {
                    if (this.user && this.user.bidang && this.user.bidang !== 'Semua') {
                        this.jenisArsipOptions = this.klasifikasiOptions.filter(o => o.bidang.toLowerCase() === this.user.bidang.toLowerCase());
                    } else {
                        this.jenisArsipOptions = this.klasifikasiOptions.filter(o => o.bidang.toLowerCase() === this.formData.bidang.toLowerCase());
                    }
                } else {
                    if (this.user && this.user.bidang && this.user.bidang !== 'Semua') {
                        this.jenisArsipOptions = this.klasifikasiOptions.filter(o => o.bidang.toLowerCase() === this.user.bidang.toLowerCase());
                    } else {
                        this.jenisArsipOptions = this.klasifikasiOptions;
                    }
                }
                if (!this.formModal.isEdit) {
                    this.formData.jenisSurat = '';
                    this.formData.kodeKlasifikasi = '';
                    this.formData.noSurat = '';
                }
            },

            onJenisSuratChange() {
                if (this.formData.jenisSurat) {
                    const option = this.klasifikasiOptions.find(o => o.jenisArsip.toLowerCase() === this.formData.jenisSurat.toLowerCase());
                    if (option) {
                        this.formData.bidang = option.bidang;
                        this.formData.kodeKlasifikasi = option.kode; // Base classification code (e.g., PEM.01)
                        if (typeof google !== 'undefined' && google.script && google.script.run) {
                            google.script.run
                                .withSuccessHandler(code => {
                                    this.formData.noSurat = code; // Dynamic sequence code (e.g., PEM.01.01)
                                })
                                .getNextKodeKlasifikasi(option.bidang, this.formData.jenisSurat);
                        } else {
                            this.formData.noSurat = `${option.kode}.01`;
                        }
                    }
                } else {
                    if (!this.formModal.isEdit) {
                        this.formData.kodeKlasifikasi = '';
                        this.formData.noSurat = '';
                        this.formData.bidang = '';
                    }
                }
            }
        }));
    });
</script>
