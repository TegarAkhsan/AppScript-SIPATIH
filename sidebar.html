<aside
    class="w-64 bg-slate-900 border-r border-slate-800 flex flex-col h-full shadow-[4px_0_24px_rgba(0,0,0,0.15)] z-20">
    <!-- Logo -->
    <div class="h-16 flex items-center px-5 border-b border-slate-800">
        <div class="w-9 h-9 bg-emerald-600 rounded-xl flex items-center justify-center shadow-md">
            <i class="fas fa-folder-open text-white text-sm"></i>
        </div>
        <div class="ml-3">
            <h2 class="text-xl font-bold text-white leading-tight">SIPATIH</h2>
            <p class="text-[10px] text-emerald-400 font-medium tracking-wide">Sistem Arsip Digital</p>
        </div>
    </div>

    <!-- User Info -->
    <div class="p-4 border-b border-slate-800 bg-slate-950/40">
        <div class="flex items-center">
            <div
                class="w-9 h-9 rounded-full premium-gradient flex items-center justify-center text-white font-bold shadow-sm text-sm">
                <span x-text="user?.username.charAt(0).toUpperCase()"></span>
            </div>
            <div class="ml-3">
                <p class="text-sm font-semibold text-white capitalize leading-tight" x-text="user?.username"></p>
                <p class="text-xs text-slate-400 capitalize" x-text="user?.role"></p>
            </div>
        </div>
    </div>

    <!-- Navigation -->
    <div class="flex-1 overflow-y-auto py-3 no-scrollbar">
        <nav class="space-y-1 px-3">
            <a href="#" @click.prevent="navigate('dashboard')"
                :class="view === 'dashboard' ? 'sidebar-active' : 'text-slate-400 hover:bg-slate-800 hover:text-white'"
                class="group flex items-center px-3 py-2 text-[15px] font-medium rounded-lg transition-colors">
                <i class="fas fa-chart-pie w-6 text-center text-sm"
                    :class="view === 'dashboard' ? 'text-emerald-400' : 'text-slate-500 group-hover:text-slate-300'"></i>
                <span class="ml-2">Dashboard</span>
            </a>

            <a href="#" @click.prevent="navigate('naskah_masuk')"
                :class="view === 'naskah_masuk' ? 'sidebar-active' : 'text-slate-400 hover:bg-slate-800 hover:text-white'"
                class="group flex items-center px-3 py-2 text-[15px] font-medium rounded-lg transition-colors mt-1.5">
                <i class="fas fa-envelope-open-text w-6 text-center text-sm"
                    :class="view === 'naskah_masuk' ? 'text-emerald-400' : 'text-slate-500 group-hover:text-slate-300'"></i>
                <span class="ml-2">Naskah Masuk</span>
            </a>

            <a href="#" @click.prevent="navigate('naskah_keluar')"
                :class="view === 'naskah_keluar' ? 'sidebar-active' : 'text-slate-400 hover:bg-slate-800 hover:text-white'"
                class="group flex items-center px-3 py-2 text-[15px] font-medium rounded-lg transition-colors mt-1.5">
                <i class="fas fa-paper-plane w-6 text-center text-sm"
                    :class="view === 'naskah_keluar' ? 'text-emerald-400' : 'text-slate-500 group-hover:text-slate-300'"></i>
                <span class="ml-2">Naskah Keluar</span>
            </a>

            <a href="#" @click.prevent="navigate('bidang_dokumen')"
                :class="view === 'bidang_dokumen' ? 'sidebar-active' : 'text-slate-400 hover:bg-slate-800 hover:text-white'"
                class="group flex items-center px-3 py-2 text-[15px] font-medium rounded-lg transition-colors mt-1.5">
                <i class="fas fa-layer-group w-6 text-center text-sm"
                    :class="view === 'bidang_dokumen' ? 'text-emerald-400' : 'text-slate-500 group-hover:text-slate-300'"></i>
                <span class="ml-2">Manajemen Dokumen</span>
            </a>

            <div class="pt-3 mt-3 border-t border-slate-800">
                <p class="px-3 text-[11px] font-semibold text-slate-500 uppercase tracking-wider mb-1.5">Profil Saya
                </p>
                <a href="#" @click.prevent="navigate('profil')"
                    :class="view === 'profil' ? 'sidebar-active' : 'text-slate-400 hover:bg-slate-800 hover:text-white'"
                    class="group flex items-center px-3 py-2 text-[15px] font-medium rounded-lg transition-colors">
                    <i class="fas fa-user-circle w-6 text-center text-sm"
                        :class="view === 'profil' ? 'text-emerald-400' : 'text-slate-500 group-hover:text-slate-300'"></i>
                    <span class="ml-2">Edit Profil</span>
                </a>
            </div>

            <div x-show="user?.role === 'Admin'" class="pt-3 mt-3 border-t border-slate-800">
                <p class="px-3 text-[11px] font-semibold text-slate-500 uppercase tracking-wider mb-1.5">Administrator
                </p>
                <a href="#" @click.prevent="navigate('pengguna')"
                    :class="view === 'pengguna' ? 'sidebar-active' : 'text-slate-400 hover:bg-slate-800 hover:text-white'"
                    class="group flex items-center px-3 py-2 text-[15px] font-medium rounded-lg transition-colors">
                    <i class="fas fa-users-cog w-6 text-center text-sm"
                        :class="view === 'pengguna' ? 'text-emerald-400' : 'text-slate-500 group-hover:text-slate-300'"></i>
                    <span class="ml-2">Pengguna</span>
                </a>
                <a href="#" @click.prevent="navigate('tracking')"
                    :class="view === 'tracking' ? 'sidebar-active' : 'text-slate-400 hover:bg-slate-800 hover:text-white'"
                    class="group flex items-center px-3 py-2 text-[15px] font-medium rounded-lg transition-colors mt-1.5">
                    <i class="fas fa-history w-6 text-center text-sm"
                        :class="view === 'tracking' ? 'text-emerald-400' : 'text-slate-500 group-hover:text-slate-300'"></i>
                    <span class="ml-2">Tracking Aktivitas</span>
                </a>
            </div>
        </nav>
    </div>

    <!-- Logout -->
    <div class="p-3 border-t border-slate-800">
        <button @click="doLogout"
            class="flex items-center w-full px-3 py-2 text-[15px] font-medium text-red-400 bg-red-950/20 hover:bg-red-950/40 rounded-lg transition-colors border border-red-900/30">
            <i class="fas fa-sign-out-alt w-6 text-center text-sm"></i>
            <span class="ml-2">Logout Sistem</span>
        </button>
    </div>
</aside>
