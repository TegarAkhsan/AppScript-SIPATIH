<div x-cloak x-show="view === 'login'"
    class="min-h-screen flex items-center justify-center relative overflow-hidden"
    style="background: linear-gradient(rgba(0,0,0,0.20), rgba(0,0,0,0.20)), url('https://lh3.googleusercontent.com/d/1k-aNHCiQqlGQQflEYdO_gPvsbyvn8ZAW') no-repeat center center; background-size: cover;">
    <!-- Background elements removed to favor the image asset -->

    <!-- Logo Kampus & Desa (Top-Left) -->
    <div class="absolute top-4 left-4 md:top-6 md:left-8 flex items-center gap-3 md:gap-4 bg-white/80 backdrop-blur-md px-4 py-2 md:px-5 md:py-3 rounded-2xl border border-white/40 shadow-lg z-20">
        <img src="https://lh3.googleusercontent.com/d/1J862zJ10Kdayutl1zGMURHdfQ6ZVjQ8I" alt="Logo UNESA" class="h-8 md:h-10 w-auto object-contain">
        <div class="h-6 w-[1px] bg-gray-300"></div>
        <img src="https://lh3.googleusercontent.com/d/1N28ewmg9zCpX3MCnEui85dsg81QxzStQ" alt="Logo Vokasi UNESA" class="h-8 md:h-10 w-auto object-contain">
        <div class="h-6 w-[1px] bg-gray-300"></div>
        <img src="https://lh3.googleusercontent.com/d/1QHWBstJrAeuEChcXQaw_ZQuGZZJ0HA-V" alt="Logo Desa" class="h-8 md:h-10 w-auto object-contain">
    </div>

    <div class="glass-panel w-full max-w-md rounded-2xl p-8 relative z-10">
        <div class="text-center mb-8">
            <div class="w-20 h-20 bg-emerald-600 rounded-full flex items-center justify-center mx-auto mb-4 shadow-lg">
                <i class="fas fa-folder-open text-3xl text-white"></i>
            </div>
            <h1 class="text-3xl font-bold text-gray-900 tracking-tight">SIPATIH</h1>
            <p class="text-gray-500 mt-2 text-sm">Sistem Arsip Digital Desa Kepatihan</p>
        </div>

        <!-- Login Error Alert -->
        <div x-cloak x-show="loginError" class="mb-4 bg-red-50 border-l-4 border-red-500 p-4 rounded-r-md">
            <div class="flex">
                <div class="flex-shrink-0">
                    <i class="fas fa-exclamation-circle text-red-500"></i>
                </div>
                <div class="ml-3">
                    <p class="text-sm text-red-700 font-medium" x-text="loginError"></p>
                </div>
            </div>
        </div>

        <form @submit.prevent="doLogin" class="space-y-6">
            <div>
                <label class="block text-sm font-medium text-gray-700 mb-1">Username</label>
                <div class="relative">
                    <div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none">
                        <i class="fas fa-user text-gray-400"></i>
                    </div>
                    <input type="text" x-model="username" required
                        class="block w-full pl-10 pr-3 py-3 border border-gray-300 rounded-xl focus:ring-2 focus:ring-emerald-500 focus:border-emerald-500 transition-colors shadow-sm"
                        placeholder="Masukkan username">
                </div>
            </div>

            <div x-data="{ showPassword: false }">
                <label class="block text-sm font-medium text-gray-700 mb-1">Password</label>
                <div class="relative">
                    <div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none">
                        <i class="fas fa-lock text-gray-400"></i>
                    </div>
                    <input :type="showPassword ? 'text' : 'password'" x-model="password" required
                        class="block w-full pl-10 pr-10 py-3 border border-gray-300 rounded-xl focus:ring-2 focus:ring-emerald-500 focus:border-emerald-500 transition-colors shadow-sm"
                        placeholder="Masukkan password">
                    <div class="absolute inset-y-0 right-0 pr-3 flex items-center cursor-pointer z-20" @click="showPassword = !showPassword">
                        <i class="fas text-gray-400 hover:text-gray-600 animate-pulse-hover" :class="showPassword ? 'fa-eye-slash' : 'fa-eye'"></i>
                    </div>
                </div>
            </div>


            <button type="submit" :disabled="isLoading"
                class="w-full flex justify-center items-center py-3 px-4 border border-transparent rounded-xl shadow-sm text-sm font-medium text-white bg-emerald-600 hover:bg-emerald-700 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-emerald-500 btn-hover disabled:opacity-70">
                <i x-show="isLoading" class="fas fa-circle-notch fa-spin mr-2"></i>
                <span x-text="isLoading ? 'Memproses...' : 'Masuk Sistem'"></span>
            </button>


        </form>
    </div>

    <!-- Copyright -->
    <div class="absolute bottom-6 right-8 text-white/50 text-xs font-medium select-none drop-shadow-sm pointer-events-none">
        &copy; D4 Administrasi Negara UNESA
    </div>
</div>
